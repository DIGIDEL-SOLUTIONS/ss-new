<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in | Rooflyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<header class="site-header"><div class="container header-inner">
<a href="../index.html" class="logo"><span class="logo-mark">R</span> Rooflyzer <span class="logo-os">OS</span></a>
<div class="header-actions"><a href="demo.html" class="btn btn-ghost">Book a demo</a></div>
</div></header>
<section class="section"><div class="container" style="max-width:420px;margin:0 auto">
<div class="card">
<span class="badge">app.rooflyzer.pro</span>
<h1 style="font-family:var(--display);font-size:1.5rem;margin:1rem 0">Sign in to Rooflyzer OS</h1>
<form onsubmit="event.preventDefault();alert('Marketing-site mock. Open app.rooflyzer.pro for production auth.');">
<div class="field" style="margin-bottom:.75rem"><label>Email</label><input type="email" required placeholder="you@company.com"/></div>
<div class="field" style="margin-bottom:1rem"><label>Password</label><input type="password" required placeholder="••••••••"/></div>
<button class="btn btn-gold" style="width:100%" type="submit">Sign in</button>
</form>
<p class="text-xs text-muted mt-4" style="text-align:center">
Prefer production? <a href="https://app.rooflyzer.pro" style="color:var(--gold)">app.rooflyzer.pro</a>
</p>
</div>
</div></section>
<script src="../js/main.js"></script>
</body></html>
